[package]
name = "ijdocs-server"
version = "0.1.0"
authors = ["nick22985"]
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
zip = "9.0"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
scraper = "0.20"
html2md = "0.2"
percent-encoding = "2"
mime_guess = "2"
ego-tree = "0.6"

[profile.release]
lto = true
strip = true
